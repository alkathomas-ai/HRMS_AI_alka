<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" type="image/x-icon" href="./public/bubbles.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      /* html{visibility:hidden;opacity:0} */
      #theme-loader{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:9999}
      #theme-loader::after{content:'';width:40px;height:40px;border:4px solid #e0e0e0;border-top-color:var(--color-primary);border-radius:50%;animation:spin 0.8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
    <script>
      const themes = {
        'Crimson': {primary:'#E22D30',soft:'#F04D4D',hover:'#B52226',hover_secondary:'#ffe1e1',light:'rgba(240, 77, 77, 0.23)',primary_medium:'#ed6669',primary_low:'#e5af78',background_light:'#ffdbdb',color_bg_pages_primary:'#f04d4d3b',assistant:{baseStart:'#FFF1E6',baseEnd:'#FDD6D6',glowPrimary:'rgba(255, 180, 180, 0.6)',glowSecondary:'rgba(255, 220, 190, 0.45)',textPrimary:'#2B1C1C',textSecondary:'#6B4A4A'}},
        'Royal Blue': {primary:'#1E40AF',soft:'#3B82F6',hover:'#1E3A8A',hover_secondary:'#e0e9ff',light:'rgba(59, 130, 246, 0.23)',primary_medium:'#6397f4',primary_low:'#7dcefd',background_light:'#dbeafe',color_bg_pages_primary:'#b4cdff99',assistant:{baseStart:'#EEF3FF',baseEnd:'#DCE7FF',glowPrimary:'rgba(180, 205, 255, 0.6)',glowSecondary:'rgba(210, 225, 255, 0.45)',textPrimary:'#1C2B4A',textSecondary:'#415A8A'}},
        'Emerald': {primary:'#065F46',soft:'#16b480',hover:'#065F46',hover_secondary:'#e9fff9',light:'rgba(16, 185, 129, 0.23)',primary_medium:'#058a64',primary_low:'#15bf87',background_light:'#c0e6db',color_bg_pages_primary:'#b4f0d799',assistant:{baseStart:'#ECFDF7',baseEnd:'#D1FAE5',glowPrimary:'rgba(180, 240, 215, 0.6)',glowSecondary:'rgba(215, 250, 235, 0.45)',textPrimary:'#0F3D2E',textSecondary:'#2F6B57'}},
        'Amethyst': {primary:'#6D28D9',soft:'#8B5CF6',hover:'#5B21B6',hover_secondary:'#f4ecff',light:'rgba(139, 92, 246, 0.23)',primary_medium:'#b66dee',primary_low:'#d380ca',background_light:'#e9dbff',color_bg_pages_primary:'#dcc3ff99',assistant:{baseStart:'#F4F1FF',baseEnd:'#E4DCFF',glowPrimary:'rgba(220, 195, 255, 0.6)',glowSecondary:'rgba(240, 225, 255, 0.45)',textPrimary:'#2B1C3D',textSecondary:'#5A3E85'}}
      };
      const saved = localStorage.getItem('theme');
      const themeName = saved ? JSON.parse(saved).name : 'Royal Blue';
      const t = themes[themeName] || themes['Royal Blue'];
      const r = document.documentElement.style;
      r.setProperty('--color-primary', t.primary);
      r.setProperty('--color-primary-soft', t.soft);
      r.setProperty('--color-primary-hover', t.hover);
      r.setProperty('--color-secondary-hover', t.hover_secondary);
      r.setProperty('--color-primary-light', t.light);
      r.setProperty('--color-primary-medium', t.primary_medium);
      r.setProperty('--color-primary-low', t.primary_low);
      r.setProperty('--background-light', t.background_light);
      r.setProperty('--color-bg-pages-primary', t.color_bg_pages_primary);
      r.setProperty('--assistant-base-start', t.assistant.baseStart);
      r.setProperty('--assistant-base-end', t.assistant.baseEnd);
      r.setProperty('--assistant-glow-primary', t.assistant.glowPrimary);
      r.setProperty('--assistant-glow-secondary', t.assistant.glowSecondary);
      r.setProperty('--assistant-text-primary', t.assistant.textPrimary);
      r.setProperty('--assistant-text-secondary', t.assistant.textSecondary);
      r.setProperty('--loader-color', t.soft);
    </script>
    <title>hrms-ai</title>
  </head>
  <body>
    <div id="theme-loader"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>window.addEventListener('load',()=>{document.getElementById('theme-loader')?.remove();})</script>
  </body>
</html>
