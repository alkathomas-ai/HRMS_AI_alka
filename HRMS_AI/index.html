<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" type="image/x-icon" href="./public/bubbles.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      #theme-loader{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:9999}
      #theme-loader::after{content:'';width:40px;height:40px;border:4px solid #e0e0e0;border-top-color:#3B82F6;border-radius:50%;animation:spin 0.8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
    <script>
      const saved = localStorage.getItem('theme');
      if (!saved || JSON.parse(saved).name === 'Royal Blue') {
        const r = document.documentElement.style;
        r.setProperty('--color-primary', '#1E40AF');
        r.setProperty('--color-primary-soft', '#3B82F6');
        r.setProperty('--color-primary-hover', '#1E3A8A');
        r.setProperty('--color-secondary-hover', '#e0e9ff');
        r.setProperty('--color-primary-light', 'rgba(59, 130, 246, 0.23)');
        r.setProperty('--color-primary-medium', '#6397f4');
        r.setProperty('--color-primary-low', '#7dcefd');
        r.setProperty('--background-light', '#dbeafe');
        r.setProperty('--color-bg-pages-primary', '#b4cdff99');
        r.setProperty('--assistant-base-start', '#EEF3FF');
        r.setProperty('--assistant-base-end', '#DCE7FF');
        r.setProperty('--assistant-glow-primary', 'rgba(180, 205, 255, 0.6)');
        r.setProperty('--assistant-glow-secondary', 'rgba(210, 225, 255, 0.45)');
        r.setProperty('--assistant-text-primary', '#1C2B4A');
        r.setProperty('--assistant-text-secondary', '#415A8A');
      }
    </script>
    <title>hrms-ai</title>
  </head>
  <body>
    <div id="theme-loader"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>window.addEventListener('load',()=>document.getElementById('theme-loader')?.remove())</script>
  </body>
</html>
